<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d4f2"/>
      <stop offset="1" stop-color="#e6f4ff"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c96f3b"/>
      <stop offset="1" stop-color="#9e4f22"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1e0c" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#3a1e0c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3a1e0c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <ellipse cx="260" cy="65" rx="85" ry="22" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="920" cy="50" rx="95" ry="24" fill="#ffffff" opacity="0.65"/>
  <!-- 绿篱 -->
  <rect x="40" y="170" width="1120" height="60" fill="#2e7d3a"/>
  <g fill="#3a9448">
    <circle cx="90" cy="175" r="20"/><circle cx="160" cy="170" r="22"/><circle cx="230" cy="176" r="19"/>
    <circle cx="300" cy="170" r="21"/><circle cx="370" cy="175" r="20"/><circle cx="440" cy="170" r="22"/>
    <circle cx="510" cy="175" r="19"/><circle cx="580" cy="170" r="21"/><circle cx="650" cy="175" r="20"/>
    <circle cx="720" cy="170" r="22"/><circle cx="790" cy="175" r="19"/><circle cx="860" cy="170" r="21"/>
    <circle cx="930" cy="175" r="20"/><circle cx="1000" cy="170" r="22"/><circle cx="1070" cy="175" r="19"/>
    <circle cx="1130" cy="170" r="21"/>
  </g>
  <rect x="40" y="110" width="1120" height="70" fill="none" stroke="#54656f" stroke-width="5"/>
  <!-- 红土场地 -->
  <polygon points="180,230 1020,230 1200,400 0,400" fill="url(#clay)"/>
  <polygon points="180,230 1020,230 1200,400 0,400" fill="none" stroke="#f5e9d8" stroke-width="4"/>
  <polygon points="320,230 880,230 1000,400 200,400" fill="#d97f47" opacity="0.5"/>
  <g stroke="#f5e9d8" stroke-width="3">
    <line x1="320" y1="230" x2="200" y2="400"/>
    <line x1="880" y1="230" x2="1000" y2="400"/>
    <line x1="260" y1="320" x2="940" y2="320"/>
    <line x1="290" y1="275" x2="910" y2="275"/>
  </g>
  <!-- 球网 -->
  <rect x="300" y="196" width="8" height="40" fill="#4a3527"/>
  <rect x="892" y="196" width="8" height="40" fill="#4a3527"/>
  <rect x="306" y="200" width="588" height="30" fill="#f2ede4" opacity="0.92"/>
  <g stroke="#a89a88" stroke-width="1">
    <line x1="340" y1="200" x2="340" y2="230"/><line x1="390" y1="200" x2="390" y2="230"/>
    <line x1="440" y1="200" x2="440" y2="230"/><line x1="490" y1="200" x2="490" y2="230"/>
    <line x1="540" y1="200" x2="540" y2="230"/><line x1="590" y1="200" x2="590" y2="230"/>
    <line x1="640" y1="200" x2="640" y2="230"/><line x1="690" y1="200" x2="690" y2="230"/>
    <line x1="740" y1="200" x2="740" y2="230"/><line x1="790" y1="200" x2="790" y2="230"/>
    <line x1="840" y1="200" x2="840" y2="230"/><line x1="885" y1="200" x2="885" y2="230"/>
  </g>
  <line x1="306" y1="215" x2="894" y2="215" stroke="#ffffff" stroke-width="4"/>
  <!-- 大网球装饰 -->
  <circle cx="1080" cy="320" r="70" fill="#d8e830" opacity="0.95"/>
  <path d="M1025 285 Q1080 320 1135 285" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M1025 355 Q1080 320 1135 355" fill="none" stroke="#ffffff" stroke-width="8"/>
  <!-- 文案区 -->
  <rect x="0" y="0" width="640" height="400" fill="url(#overlay)"/>
  <text x="70" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">多样化场地选择</text>
  <text x="70" y="245" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#f0dfd0">硬地、红土、草地，满足各类水平人群</text>
</svg>
