<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223f"/>
      <stop offset="0.6" stop-color="#3c4a76"/>
      <stop offset="1" stop-color="#75648a"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb8"/>
      <stop offset="1" stop-color="#21557f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1626" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#0a1626" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0a1626" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#dusk)"/>
  <circle cx="120" cy="60" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="300" cy="40" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="560" cy="70" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="980" cy="45" r="2.5" fill="#fff" opacity="0.8"/>
  <!-- 灯塔 -->
  <g>
    <rect x="130" y="100" width="10" height="140" fill="#2c3945"/>
    <rect x="96" y="78" width="78" height="28" rx="4" fill="#374552"/>
    <circle cx="135" cy="92" r="50" fill="url(#glow)"/>
    <circle cx="135" cy="92" r="10" fill="#ffefb0"/>
  </g>
  <g>
    <rect x="1060" y="100" width="10" height="140" fill="#2c3945"/>
    <rect x="1026" y="78" width="78" height="28" rx="4" fill="#374552"/>
    <circle cx="1065" cy="92" r="50" fill="url(#glow)"/>
    <circle cx="1065" cy="92" r="10" fill="#ffefb0"/>
  </g>
  <!-- 场地 -->
  <polygon points="180,230 1020,230 1200,400 0,400" fill="url(#court)"/>
  <polygon points="180,230 1020,230 1200,400 0,400" fill="none" stroke="#cfe6f0" stroke-width="4"/>
  <polygon points="320,230 880,230 1000,400 200,400" fill="#3a8fc4" opacity="0.5"/>
  <g stroke="#cfe6f0" stroke-width="3">
    <line x1="320" y1="230" x2="200" y2="400"/>
    <line x1="880" y1="230" x2="1000" y2="400"/>
    <line x1="260" y1="320" x2="940" y2="320"/>
    <line x1="290" y1="275" x2="910" y2="275"/>
  </g>
  <!-- 球网 -->
  <rect x="300" y="196" width="8" height="40" fill="#1c262e"/>
  <rect x="892" y="196" width="8" height="40" fill="#1c262e"/>
  <rect x="306" y="200" width="588" height="30" fill="#dde5ea" opacity="0.9"/>
  <g stroke="#8d99a2" stroke-width="1">
    <line x1="340" y1="200" x2="340" y2="230"/><line x1="390" y1="200" x2="390" y2="230"/>
    <line x1="440" y1="200" x2="440" y2="230"/><line x1="490" y1="200" x2="490" y2="230"/>
    <line x1="540" y1="200" x2="540" y2="230"/><line x1="590" y1="200" x2="590" y2="230"/>
    <line x1="640" y1="200" x2="640" y2="230"/><line x1="690" y1="200" x2="690" y2="230"/>
    <line x1="740" y1="200" x2="740" y2="230"/><line x1="790" y1="200" x2="790" y2="230"/>
    <line x1="840" y1="200" x2="840" y2="230"/><line x1="885" y1="200" x2="885" y2="230"/>
  </g>
  <line x1="306" y1="215" x2="894" y2="215" stroke="#ffffff" stroke-width="4"/>
  <!-- 大网球装饰 -->
  <circle cx="1080" cy="320" r="70" fill="#d8e830" opacity="0.9"/>
  <path d="M1025 285 Q1080 320 1135 285" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M1025 355 Q1080 320 1135 355" fill="none" stroke="#ffffff" stroke-width="8"/>
  <!-- 文案区 -->
  <rect x="0" y="0" width="640" height="400" fill="url(#overlay)"/>
  <text x="70" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">夜间照明球场</text>
  <text x="70" y="245" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" fill="#d8e2f0">专业灯光系统，夜晚也能畅快挥拍</text>
</svg>
