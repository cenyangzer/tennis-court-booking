  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <ellipse cx="130" cy="55" rx="55" ry="17" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="470" cy="65" rx="70" ry="19" fill="#ffffff" opacity="0.7"/>
  <!-- 深绿背景带 -->
  <rect x="20" y="160" width="560" height="60" fill="#2c6630"/>
  <rect x="20" y="60" width="560" height="110" fill="none" stroke="#5a6b78" stroke-width="4"/>
  <!-- 草地场地 -->
