    <line x1="45" y1="330" x2="555" y2="330"/>
    <line x1="30" y1="360" x2="570" y2="360"/>
  </g>
  <!-- 球网 -->
  <rect x="140" y="212" width="6" height="34" fill="#24352a"/>
  <rect x="454" y="212" width="6" height="34" fill="#24352a"/>
  <rect x="143" y="216" width="314" height="26" fill="#f4f6f2" opacity="0.92"/>
  <g stroke="#93a396" stroke-width="1">
    <line x1="170" y1="216" x2="170" y2="242"/><line x1="200" y1="216" x2="200" y2="242"/>
    <line x1="230" y1="216" x2="230" y2="242"/><line x1="260" y1="216" x2="260" y2="242"/>
    <line x1="290" y1="216" x2="290" y2="242"/><line x1="320" y1="216" x2="320" y2="242"/>
    <line x1="350" y1="216" x2="350" y2="242"/><line x1="380" y1="216" x2="380" y2="242"/>
    <line x1="410" y1="216" x2="410" y2="242"/><line x1="440" y1="216" x2="440" y2="242"/>
  </g>
  <line x1="143" y1="229" x2="457" y2="229" stroke="#ffffff" stroke-width="3"/>
  <!-- 网球 -->
  <circle cx="210" cy="332" r="15" fill="#d8e830" stroke="#b3c22a" stroke-width="2"/>
  <path d="M199 325 Q210 332 221 325" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M199 339 Q210 332 221 339" fill="none" stroke="#ffffff" stroke-width="2.5"/>
