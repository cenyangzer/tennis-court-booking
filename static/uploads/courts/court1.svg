  <!-- 网球 -->
  <circle cx="330" cy="330" r="16" fill="#d8e830" stroke="#b3c22a" stroke-width="2"/>
  <path d="M318 322 Q330 330 342 322" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M318 338 Q330 330 342 338" fill="none" stroke="#ffffff" stroke-width="2.5"/>
