<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9f5"/>
      <stop offset="1" stop-color="#d9efff"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb8"/>
      <stop offset="1" stop-color="#256a9e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <ellipse cx="120" cy="70" rx="55" ry="18" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="480" cy="55" rx="70" ry="20" fill="#ffffff" opacity="0.7"/>
  <!-- 围网 -->
  <rect x="20" y="60" width="560" height="180" fill="none" stroke="#5a6b78" stroke-width="4"/>
