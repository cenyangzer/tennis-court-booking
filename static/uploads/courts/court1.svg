    <line x1="450" y1="240" x2="490" y2="380"/>
    <line x1="128" y1="310" x2="472" y2="310"/>
    <line x1="140" y1="275" x2="460" y2="275"/>
  </g>
  <!-- 球网 -->
  <g>
    <rect x="140" y="212" width="6" height="34" fill="#2d3a44"/>
    <rect x="454" y="212" width="6" height="34" fill="#2d3a44"/>
    <rect x="143" y="216" width="314" height="26" fill="#f0f0f0" opacity="0.92"/>
    <g stroke="#9aa5ad" stroke-width="1">
      <line x1="160" y1="216" x2="160" y2="242"/><line x1="180" y1="216" x2="180" y2="242"/>
      <line x1="200" y1="216" x2="200" y2="242"/><line x1="220" y1="216" x2="220" y2="242"/>
      <line x1="240" y1="216" x2="240" y2="242"/><line x1="260" y1="216" x2="260" y2="242"/>
      <line x1="280" y1="216" x2="280" y2="242"/><line x1="300" y1="216" x2="300" y2="242"/>
      <line x1="320" y1="216" x2="320" y2="242"/><line x1="340" y1="216" x2="340" y2="242"/>
      <line x1="360" y1="216" x2="360" y2="242"/><line x1="380" y1="216" x2="380" y2="242"/>
      <line x1="400" y1="216" x2="400" y2="242"/><line x1="420" y1="216" x2="420" y2="242"/>
      <line x1="440" y1="216" x2="440" y2="242"/>
