    <line x1="20" y1="110" x2="580" y2="110"/><line x1="20" y1="130" x2="580" y2="130"/>
    <line x1="20" y1="150" x2="580" y2="150"/><line x1="20" y1="170" x2="580" y2="170"/>
    <line x1="80" y1="60" x2="80" y2="240"/><line x1="160" y1="60" x2="160" y2="240"/>
    <line x1="240" y1="60" x2="240" y2="240"/><line x1="320" y1="60" x2="320" y2="240"/>
    <line x1="400" y1="60" x2="400" y2="240"/><line x1="480" y1="60" x2="480" y2="240"/>
  </g>
  <!-- 场地（蓝绿硬地，透视） -->
