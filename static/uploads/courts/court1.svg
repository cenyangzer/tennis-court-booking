  <polygon points="90,240 510,240 580,380 20,380" fill="none" stroke="#e8f4f8" stroke-width="3"/>
  <polygon points="150,240 450,240 490,380 110,380" fill="#3a8fc4" opacity="0.55"/>
  <g stroke="#e8f4f8" stroke-width="2.5">
